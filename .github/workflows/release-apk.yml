name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versão do release, sem o prefixo v (ex.: 0.1.0)"
        required: true
        default: "0.1.0"
        type: string
      prerelease:
        description: "Publicar como pré-release sem substituir o download estável latest"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}

jobs:
  build-and-release:
    name: Build and publish APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run tests and build debug APK
        run: gradle test assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "SportCam-${{ env.RELEASE_VERSION }}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "SportCam-latest-debug.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}
          name: SportCam ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}
          prerelease: ${{ (github.event_name == 'push' && contains(github.ref_name, '-test.')) || inputs.prerelease }}
          make_latest: ${{ ((github.event_name == 'push' && contains(github.ref_name, '-test.')) || inputs.prerelease) && 'false' || 'true' }}
          generate_release_notes: true
          files: |
            SportCam-${{ env.RELEASE_VERSION }}-debug.apk
            SportCam-latest-debug.apk
