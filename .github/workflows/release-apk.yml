name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versão do release, sem o prefixo v (ex.: 0.1.0)"
        required: true
        default: "0.1.0"
        type: string
      prerelease:
        description: "Publicar como pré-release sem substituir o download estável latest"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}

jobs:
  build-and-release:
    name: Build and publish APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Sem chave fixa, cada runner gera um debug.keystore próprio e todo APK publicado sai com
      # assinatura diferente. O Android recusa atualizar por cima de assinatura que não confere, e
      # desinstalar apaga a configuração do app, que não tem backup. Com o secret definido, as
      # atualizações passam a instalar por cima.
      - name: Restaurar keystore de debug
        env:
          DEBUG_KEYSTORE: ${{ secrets.SPORTCAM_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$DEBUG_KEYSTORE" ]; then
            echo "::warning::Secret SPORTCAM_DEBUG_KEYSTORE ausente; este APK sairá com assinatura nova e exigirá desinstalar a versão anterior."
            exit 0
          fi
          printf '%s' "$DEBUG_KEYSTORE" | base64 -d > "$RUNNER_TEMP/sportcam-debug.keystore"
          echo "SPORTCAM_DEBUG_KEYSTORE_FILE=$RUNNER_TEMP/sportcam-debug.keystore" >> "$GITHUB_ENV"

      - name: Run tests and build debug APK
        run: gradle test assembleDebug --stacktrace

      # A assinatura fica registrada no log: se este valor mudar entre releases, atualizar por cima
      # volta a falhar, e é melhor descobrir aqui do que com o celular na mão.
      - name: Registrar assinatura do APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs \
            app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256 digest"

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "SportCam-${{ env.RELEASE_VERSION }}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "SportCam-latest-debug.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}
          name: SportCam ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}
          prerelease: ${{ (github.event_name == 'push' && contains(github.ref_name, '-test.')) || inputs.prerelease }}
          make_latest: ${{ ((github.event_name == 'push' && contains(github.ref_name, '-test.')) || inputs.prerelease) && 'false' || 'true' }}
          generate_release_notes: true
          files: |
            SportCam-${{ env.RELEASE_VERSION }}-debug.apk
            SportCam-latest-debug.apk
